<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Text Refiner Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="sparkle">✨</span>
        <h1>AI Text Refiner</h1>
      </div>
      <div class="toggle-container">
        <label class="toggle">
          <input type="checkbox" id="extensionEnabled" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Main Settings -->
    <main class="settings">
      <!-- Provider Section -->
      <section class="section">
        <h2 class="section-title">LLM Provider</h2>
        <div class="form-group">
          <label for="provider">Select Provider</label>
          <select id="provider" class="select">
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI GPT</option>
            <option value="anthropic">Anthropic Claude</option>
            <option value="custom">Custom API Endpoint</option>
          </select>
        </div>

        <div class="form-group" id="customEndpointGroup" style="display: none;">
          <label for="customEndpoint">Custom API Endpoint</label>
          <input type="url" id="customEndpoint" class="input" placeholder="https://your-api-endpoint.com/v1/chat">
        </div>
      </section>

      <!-- API Configuration -->
      <section class="section">
        <h2 class="section-title">API Configuration</h2>

        <!-- Get API Key Link -->
        <div id="apiKeyHelp" class="form-group api-help">
          <small class="hint">
            <strong>Need an API key?</strong>
            <a id="getApiKeyLink" href="#" target="_blank" class="hint-link">Get one here</a>
          </small>
        </div>

        <div class="form-group">
          <label for="apiKey">API Key</label>
          <div class="input-with-button">
            <input type="password" id="apiKey" class="input" placeholder="Enter your API key">
            <button type="button" id="toggleApiKey" class="btn-icon" title="Toggle visibility">
              <span class="eye-icon">👁️</span>
            </button>
          </div>
          <small class="hint">Your API key is stored securely in Chrome's sync storage</small>
        </div>

        <!-- Test API Key Button -->
        <div class="form-group">
          <button type="button" id="testApiBtn" class="btn btn-secondary btn-small">
            <span class="btn-text">Test API Key</span>
          </button>
        </div>

        <div class="form-group">
          <label for="model">Model</label>
          <select id="model" class="select">
            <!-- Options populated dynamically based on provider -->
          </select>
        </div>

        <div class="form-group">
          <label for="temperature">
            Temperature: <span id="temperatureValue">0.7</span>
          </label>
          <input type="range" id="temperature" class="range" min="0" max="1" step="0.1" value="0.7">
          <div class="range-labels">
            <span>Precise</span>
            <span>Creative</span>
          </div>
        </div>

        <div class="form-group">
          <label for="maxTokens">Max Tokens</label>
          <input type="number" id="maxTokens" class="input" value="65536" min="1" max="65536">
        </div>
      </section>

      <!-- Refinement Style -->
      <section class="section">
        <h2 class="section-title">Refinement Style</h2>
        <div class="form-group">
          <label for="style">Style Preset</label>
          <select id="style" class="select">
            <option value="professional">Professional</option>
            <option value="casual">Casual / Friendly</option>
            <option value="concise">Concise</option>
            <option value="creative">Creative</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="form-group" id="customInstructionsGroup" style="display: none;">
          <label for="customInstructions">Custom Instructions</label>
          <textarea id="customInstructions" class="textarea" rows="4"
            placeholder="Enter your custom refinement instructions..."></textarea>
        </div>
      </section>

      <!-- UI Settings -->
      <section class="section">
        <h2 class="section-title">UI Settings</h2>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="showOnHoverOnly">
            <span class="checkmark"></span>
            Show icon on hover only
          </label>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="enableKeyboardShortcut" checked>
            <span class="checkmark"></span>
            Enable keyboard shortcut (Ctrl+Shift+R)
          </label>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="enableUndo" checked>
            <span class="checkmark"></span>
            Enable undo after refinement
          </label>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="darkMode">
            <span class="checkmark"></span>
            Dark mode for popup
          </label>
        </div>
      </section>

      <!-- Action Buttons -->
      <div class="actions">
        <button type="button" id="saveBtn" class="btn btn-primary">
          <span class="btn-text">Save Settings</span>
        </button>
        <button type="button" id="resetBtn" class="btn btn-secondary">
          <span class="btn-text">Reset to Defaults</span>
        </button>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <span class="toast-icon"></span>
      <span class="toast-message"></span>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>v1.0.0 • <a href="#" id="privacyLink">Privacy Policy</a></p>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
